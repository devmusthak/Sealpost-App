name: sealpost
description: "A new Flutter project."
publish_to: 'none' 
version: 0.0.1+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.0.2
  get: ^4.7.3
  dio: ^5.9.0
  socket_io_client: ^3.1.2
  shared_preferences: ^2.5.3
  skeletonizer: ^2.1.3
  firebase_core: ^4.6.0
  firebase_messaging: ^16.0.0
  path_provider: ^2.1.5
  html: ^0.15.4
  linkify: ^5.0.0
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  pdfx: ^2.9.2
  share_plus: ^12.0.2
  file_picker: ^10.1.9
  app_links: ^6.4.1
  flutter_local_notifications: ^21.0.0
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
